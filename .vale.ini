; https://docs.vale.sh/topics/.vale.ini

StylesPath = .vale

MinAlertLevel = suggestion

Packages = ai-tells, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells-commits.zip

[formats]
mjs = js
mts = ts

# markdown
[{apps,packages,docs}/*.{md,mdx}]
BasedOnStyles = Vale, ai-tells

# code comments
[{apps,packages}/*.{js,mjs,mts,ts,tsx,css}]
BasedOnStyles = ai-tells
