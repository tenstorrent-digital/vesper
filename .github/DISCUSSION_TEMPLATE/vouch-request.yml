body:
  - type: markdown
    attributes:
      value: |
        > [!IMPORTANT]
        > This form is for contributors who need to be vouched before submitting pull requests. Please read the [Contributing Guide](https://github.com/tenstorrent-digital/vesper/blob/main/CONTRIBUTING.md), including the AI usage policy, before submitting.
        >
        > Keep your request brief and write it in your own words. Do not have an AI write it for you. A Vesper admin will comment `!vouch` if your request is approved, after which you can submit pull requests.
  - type: textarea
    id: what
    attributes:
      label: What do you want to change?
      description: |
        Describe the change you'd like to make to Vesper. If there is an existing issue or discussion, link to it.
      placeholder: |
        I'd like to fix the focus ring described in #1234, which...
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why do you want to make this change?
      description: |
        Explain your motivation. Why is this change important or useful?
      placeholder: |
        This bug affects anyone who...
    validations:
      required: true
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: "I acknowledge that:"
      options:
        - label: >-
            I have read the
            [Contributing Guide](https://github.com/tenstorrent-digital/vesper/blob/main/CONTRIBUTING.md)
            and understand the contribution process.
          required: true
        - label: >-
            I have read and agree to follow the
            [AI Usage Policy](https://github.com/tenstorrent-digital/vesper/blob/main/AI_POLICY.md).
          required: true
        - label: >-
            I understand my code, and can explain my changes without the use of AI tools.
          required: true
        - label: >-
            I wrote this vouch request myself, in my own voice, without AI generating it.
          required: true
