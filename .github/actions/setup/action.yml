# reusable setup action for the monorepo
#
# does its best to restore `node_modules` from the cache, and falls back to a full
# `yarn install` if the cache is not available
#
# can be used for any workflow that needs to setup node, run `install` for monorepo
# dependencies, or install and use Playwright browsers

name: Setup
description: Set up Node, install monorepo dependencies (cached) and (optionally) install Playwright browsers

inputs:
  playwright:
    # pass "true" to install playwright browsers and their system deps
    description: Install Playwright's chromium browser and its system dependencies
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # !! extremely linux-pilled accelerationism ahead:
    #
    # both of the steps below shell out to `apt-get update`, which will fail the whole job on any
    # unreachable or inconsistent apt source (`playwright install-deps` exits 100)
    #
    # the ubuntu-latest image ships a google chrome apt source that intermittently serves a
    # `Packages.gz` file that doesn't match its freshly published `Release` file ("Hash Sum
    # mismatch"), and because your eyes are already glazing over and you're wondering if any human
    # even understands this, just know:
    #
    # we don't need it to install Playwright's system libraries, so we can drop it before we
    # install anything
    #
    # (don't worry)
    #
    # note: runs in the background, so it overlaps the cache restores below
    - name: Refresh apt package lists (in background)
      if: inputs.playwright == 'true'
      shell: bash
      run: |
        sudo rm -f /etc/apt/sources.list.d/google-chrome.list
        # keeps running after this step - `Install Playwright` should wait for the status file
        #
        # note: `|| status=$?` since bash steps run with `-e` (a failed update would otherwise exit
        # the subshell before writing the status file), and `timeout` so a hung update can't
        # still hold the apt lock when Playwright starts
        #
        # note: the subshell's output is detached from the step - the runner would otherwise keep
        # the step open until the update finishes, and nothing would overlap
        (
          status=0
          sudo timeout --kill-after=10s 2m apt-get update || status=$?
          echo "$status" > "$RUNNER_TEMP/apt-update.status"
        ) > "$RUNNER_TEMP/apt-update.log" 2>&1 < /dev/null &
        echo "$!" > "$RUNNER_TEMP/apt-update.pid"

    # note:
    # node is cached with `node_modules` below, otherwise `setup-node` downloads it
    # every run
    - name: Resolve Node version
      id: node
      shell: bash
      run: |
        echo "version=$(sed 's/^v//' .nvmrc | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

    # try restoring `node_modules` from the cache, instead of letting yarn re-link it
    # every workflow run - `restore-keys` gives us a warm `node_modules` on a cache miss,
    # so the `yarn install` below ends up being cheaper
    - name: Restore node_modules
      id: node-modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
          ${{ runner.tool_cache }}/node/${{ steps.node.outputs.version }}
        # note: bump `v2` if `path` changes, otherwise stale entries may be restored
        key: node-modules-v2-${{ runner.os }}-${{ hashFiles('.nvmrc', 'yarn.lock', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}
        restore-keys: |
          node-modules-v2-${{ runner.os }}-

    - name: Setup Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version-file: ".nvmrc"
        # only restore (and save) yarn's download cache if we need to install
        # note: the truthy value has to come first - `x && '' || 'yarn'` would _always_ be `yarn`,
        # because GitHub's pseudo-ternary falls through to the `||` branch on any falsy value
        cache: ${{ steps.node-modules.outputs.cache-hit != 'true' && 'yarn' || '' }}
        # setup-node v5+ auto-enables the yarn cache from the `packageManager` field in
        # `package.json`, which would ignore the conditional `cache` above
        package-manager-cache: false

    - name: Install dependencies
      if: steps.node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: |
        # yarn 1 intermittently leaves a cache entry for a platform-specific optional dependency
        # half-written and then fails to read it back, e.g.
        # `ENOENT: no such file or directory, open '.../@esbuild/linux-s390x/.yarn-metadata.json'`
        # so retry once from a clean slate before failing the job
        # see: https://github.com/yarnpkg/yarn/issues/3923
        if ! yarn install --frozen-lockfile; then
          echo "::warning::\`yarn install\` failed - clearing caches and retrying"
          yarn cache clean
          rm -rf node_modules apps/*/node_modules packages/*/node_modules
          yarn install --frozen-lockfile
        fi

    - name: Resolve Playwright version
      if: inputs.playwright == 'true'
      id: playwright-version
      shell: bash
      run: |
        echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

    # restore playwright from cache too
    #
    # NOTE:
    # we're using headless shell only (`--only-shell`) since CI never launches full
    # chromium anyways (half the size)
    - name: Restore Playwright browsers
      if: inputs.playwright == 'true'
      id: playwright-browsers
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-headless-shell-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

    # while the browsers are cached, the system libraries they need aren't part of the runner
    # image so we do need to install them
    - name: Install Playwright
      if: inputs.playwright == 'true'
      shell: bash
      env:
        BROWSERS_CACHE_HIT: ${{ steps.playwright-browsers.outputs.cache-hit }}
      # apt mirrors can also fail transiently, so clear the (partial) package lists and retry once
      run: |
        # the background `apt-get update` should finish first (it's killed after 2m10s at most)
        pid="$(cat "$RUNNER_TEMP/apt-update.pid")"
        for _ in $(seq 300); do
          kill -0 "$pid" 2>/dev/null || break
          sleep 0.5
        done
        echo "::group::Background \`apt-get update\` (exit status: $(cat "$RUNNER_TEMP/apt-update.status" 2>/dev/null || echo "unknown"))"
        cat "$RUNNER_TEMP/apt-update.log" 2>/dev/null || true
        echo "::endgroup::"

        if [ "$BROWSERS_CACHE_HIT" = "true" ]; then
          install=(npx playwright install-deps chromium)
        else
          install=(npx playwright install --with-deps --only-shell chromium)
        fi

        if ! "${install[@]}"; then
          echo "::warning::\`${install[*]}\` failed - clearing apt lists and retrying"
          sudo rm -rf /var/lib/apt/lists/*
          "${install[@]}"
        fi
