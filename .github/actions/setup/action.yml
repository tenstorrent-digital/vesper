# reusable setup action for the monorepo
#
# does its best to restore `node_modules` from the cache, and falls back to a full
# `yarn install` if the cache is not available
#
# can be used for any workflow that needs to setup node, run `install` for monorepo
# dependencies, or install the latest stable Google Chrome (eg. for browser tests)

name: Setup
description: Set up Node, install monorepo dependencies (cached) and (optionally) install the latest stable Google Chrome

inputs:
  chrome:
    # pass "true" to install (or update to) the latest stable Google Chrome
    description: Install the latest stable Google Chrome, which vesper's browser tests run in
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # note:
    # node is cached with `node_modules` below, otherwise `setup-node` downloads it
    # every run
    - name: Resolve Node version
      id: node
      shell: bash
      run: |
        echo "version=$(sed 's/^v//' .nvmrc | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

    # try restoring `node_modules` from the cache, instead of letting yarn re-link it
    # every workflow run - `restore-keys` gives us a warm `node_modules` on a cache miss,
    # so the `yarn install` below ends up being cheaper
    - name: Restore node_modules
      id: node-modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          node_modules
          apps/*/node_modules
          packages/*/node_modules
          ${{ runner.tool_cache }}/node/${{ steps.node.outputs.version }}
        # note: bump `v2` if `path` changes, otherwise stale entries may be restored
        key: node-modules-v2-${{ runner.os }}-${{ hashFiles('.nvmrc', 'yarn.lock', 'package.json', 'apps/*/package.json', 'packages/*/package.json') }}
        restore-keys: |
          node-modules-v2-${{ runner.os }}-

    - name: Setup Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version-file: ".nvmrc"
        # only restore (and save) yarn's download cache if we need to install
        # note: the truthy value has to come first - `x && '' || 'yarn'` would _always_ be `yarn`,
        # because GitHub's pseudo-ternary falls through to the `||` branch on any falsy value
        cache: ${{ steps.node-modules.outputs.cache-hit != 'true' && 'yarn' || '' }}
        # setup-node v5+ auto-enables the yarn cache from the `packageManager` field in
        # `package.json`, which would ignore the conditional `cache` above
        package-manager-cache: false

    - name: Install dependencies
      if: steps.node-modules.outputs.cache-hit != 'true'
      shell: bash
      run: |
        # yarn 1 intermittently leaves a cache entry for a platform-specific optional dependency
        # half-written and then fails to read it back, e.g.
        # `ENOENT: no such file or directory, open '.../@esbuild/linux-s390x/.yarn-metadata.json'`
        # so retry once from a clean slate before failing the job
        # see: https://github.com/yarnpkg/yarn/issues/3923
        if ! yarn install --frozen-lockfile; then
          echo "::warning::\`yarn install\` failed - clearing caches and retrying"
          yarn cache clean
          rm -rf node_modules apps/*/node_modules packages/*/node_modules
          yarn install --frozen-lockfile
        fi

    # the runner image ships Google Chrome, but only updates it when the image is rebuilt, so it can
    # lag behind the latest stable release (and its security fixes)
    #
    # `playwright install chrome` downloads and installs the current stable release from
    # dl.google.com (installing over the preinstalled one, since `CI` is set) - no browsers are
    # downloaded to Playwright's cache
    - name: Install Google Chrome
      if: inputs.chrome == 'true'
      shell: bash
      # apt mirrors can fail transiently, so clear the (partial) package lists and retry once
      run: |
        # !! extremely linux-pilled accelerationism ahead:
        #
        # the install script shells out to `apt-get update`, which will fail the whole job on any
        # unreachable or inconsistent apt source
        #
        # the ubuntu-latest image ships a google chrome apt source that intermittently serves a
        # `Packages.gz` file that doesn't match its freshly published `Release` file ("Hash Sum
        # mismatch"), and because your eyes are already glazing over and you're wondering if any
        # human even understands this, just know:
        #
        # we download the Chrome package directly, so we don't need its apt source and can drop it
        # before we install anything
        #
        # (don't worry)
        sudo rm -f /etc/apt/sources.list.d/google-chrome.list

        install=(npx playwright install chrome)
        if ! "${install[@]}"; then
          echo "::warning::\`${install[*]}\` failed - clearing apt lists and retrying"
          # note: installing Chrome restores its apt source, so drop it again
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo rm -rf /var/lib/apt/lists/*
          "${install[@]}"
        fi
