name: Release

on:
  push:
    branches: [main]
    # The vouch workflows push `.github/VOUCHED.td` to `main` using a GitHub App
    # token, which (unlike `GITHUB_TOKEN`) does trigger workflows. Those commits
    # never version anything, so skip them instead of starting a release run.
    paths-ignore:
      - ".github/VOUCHED.td"
    # no `workflow_dispatch` for running from UI
    # a manual run from any ref could version, tag, and release unmerged code

# Concurrency is scoped to the `release` job rather than the whole workflow, so
# routine merges to `main` don't queue behind a run sitting in the approval queue.

permissions:
  contents: read

jobs:
  check:
    name: Check for Pending Release
    runs-on: ubuntu-latest
    # Ungated on purpose: cheap and read-only. Its whole reason for existing is
    # to decide whether the gated `release` job below should even ask a human
    # for approval, so most merges to `main` never page an admin at all.
    outputs:
      publish: ${{ steps.check.outputs.publish }}

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # `fetch-depth: 0` also fetches tags, which the check below needs
          fetch-depth: 0
          persist-credentials: false

      # A release is pending when both are true:
      #
      # 1. no `.changeset/*.md` files remain, ie. the "Version Packages" PR
      #    consumed them and has been merged.
      # 2. the version currently in `packages/vesper/package.json` has no git
      #    tag yet, ie. it hasn't already been released.
      #
      # This is an exact check rather than a heuristic on the commit message,
      # which would differ between squash merges and merge commits.
      - name: Check for Pending Release
        id: check
        run: |
          set -euo pipefail

          pending="$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')"
          version="$(node -p "require('./packages/vesper/package.json').version")"
          tag="@tenstorrent/vesper@${version}"

          if [ "$pending" -ne 0 ]; then
            echo "Changesets still pending - waiting on the \"Version Packages\" PR."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "${tag} is already tagged - nothing to release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "${tag} is untagged and no changesets remain - release pending."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Requires manual approval from an environment reviewer before it runs.
    # This is the intentional friction around publishing to npm.
    environment: release

    concurrency:
      group: release-${{ github.ref }}
      # Cancelling mid-flight can leave the pushed git tags
      # or the npm publish in a half-updated state
      cancel-in-progress: false

    permissions:
      # push git tags and create GitHub releases
      contents: write
      # mint the OIDC token that npm exchanges for a short-lived registry
      # credential (trusted publishing), and sign the provenance attestation
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # changesets reads git history, so the default shallow clone isn't enough
          fetch-depth: 0
          # Keeps the write-scoped token out of `.git/config`, where dependency
          # install scripts could reuse it. Safe because `commitMode: github-api`
          # below means the action never runs `git push`.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: "yarn"

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      # Only `publish` is passed (no `version`), so the action skips version PR
      # handling entirely and goes straight to creating git tags, GitHub
      # releases, and publishing to npm. Opening the "Version Packages" PR is
      # `version.yml`'s job.
      #
      # Because this is a `push` run, the checkout is pinned to the pushed SHA:
      # what gets published is exactly what the approver signed off on, even if
      # other commits land on `main` while the run waits for approval.
      - name: Tag and Publish
        # Pinning third-party actions to a specific SHA is recommended by GitHub Actions secure use reference:
        # https://docs.github.com/en/actions/reference/security/secure-use#using-third-party-actions
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: yarn changeset:publish
          # Tags go through the GitHub API instead of the git CLI, so no
          # credential is needed on disk (see `persist-credentials` above).
          # Also signs them with GitHub's GPG key, attributed to `github-actions[bot]`.
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
