name: Changeset Check

on:
  pull_request:
    branches:
      - main

concurrency:
  # Key by PR number, not `head_ref`: that's only the branch name, so same-named
  # branches from different forks would share a group and cancel each other.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-changeset:
    name: Changeset Check
    runs-on: ubuntu-latest

    # The "Version Packages" PR opened by `release.yml` consumes every
    # `.changeset/*.md` file, so `changeset status` fails on it by design.
    # Skip the job there: a job skipped by an `if` still reports a check run,
    # and a `skipped` conclusion satisfies required status checks.
    #
    # `changeset-release/main` is the default branch name of `changesets/action`
    # (`changeset-release/<base branch>`), and the head repo check means a fork
    # can't dodge the check by naming its branch the same thing.
    if: >-
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.head_ref != 'changeset-release/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # `changeset status --since=origin/main` runs `git merge-base`, which
          # needs full history rather than the default shallow clone.
          fetch-depth: 0
          # Runs untrusted PR code, so keep the token out of `.git/config`.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "yarn"

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Check for Changeset
        run: yarn changeset status --since=origin/main
