name: Changeset Check

on:
  pull_request:
    branches:
      - main

concurrency:
  # Key by PR number, not `github.head_ref`. `head_ref` is only the source
  # branch name, so identically-named branches from different forks (eg. two
  # `patch-1` PRs) would share a group and cancel each other's checks.
  # The `github.ref` fallback only matters if a non-`pull_request` trigger is
  # added later, where `pull_request.number` would be empty.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-changeset:
    name: Changeset Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # `changeset status --since=origin/main` runs `git merge-base origin/main HEAD`,
          # which requires full history rather than the default shallow clone.
          fetch-depth: 0
          # This workflow runs untrusted PR code (`yarn install`, `changeset status`).
          # Don't leave the token in `.git/config` where those steps could read it.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "yarn"

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Check for Changeset
        run: yarn changeset status --since=origin/main
