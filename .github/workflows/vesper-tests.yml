name: Vesper Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

  # Empty `workflow_dispatch` allows this workflow to be run manually from the Actions tab:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run:
    name: Vesper Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # This workflow runs untrusted PR code (`yarn install`, Playwright
          # browser installs, the test suite). Don't leave the token in
          # `.git/config` where those steps could read it.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "yarn"

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Get Playwright Version
        id: playwright-version
        run: echo "version=$(yarn --silent playwright --version | sed 's/Version //')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: yarn playwright install --with-deps chromium

      # Browser binaries are cached, but the apt system dependencies installed by
      # `--with-deps` are not, so they must be reinstalled on a cache hit.
      - name: Install Playwright System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: yarn playwright install-deps chromium

      - name: Run Tests
        run: yarn test:vesper

      - name: Upload Artifacts
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: test-output
          path: |
            packages/vesper/test-results/
            packages/vesper/coverage/
          retention-days: 7
