name: Vesper Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # The vouch workflows push `.github/VOUCHED.td` to `main` using a GitHub App
    # token, which (unlike `GITHUB_TOKEN`) does trigger workflows. That commit
    # can't affect tests, so don't spend a run on it. Only applies to `push`;
    # pull request runs are unaffected, so the required check still gates PRs.
    paths-ignore:
      - ".github/VOUCHED.td"

  # Empty `workflow_dispatch` allows this workflow to be run manually from the Actions tab:
  workflow_dispatch:

concurrency:
  # Key PR runs by number, not `head_ref`: that's only the branch name, so
  # same-named branches from different forks would cancel each other. `push` and
  # `workflow_dispatch` runs have no PR number and fall back to `github.ref`.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run:
    name: Vesper Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Runs untrusted PR code, so keep the token out of `.git/config`.
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "yarn"

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Get Playwright Version
        id: playwright-version
        run: echo "version=$(yarn --silent playwright --version | sed 's/Version //')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: yarn playwright install --with-deps chromium

      # Browser binaries are cached, but the apt system dependencies installed by
      # `--with-deps` are not, so they must be reinstalled on a cache hit.
      - name: Install Playwright System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: yarn playwright install-deps chromium

      - name: Run Tests
        run: yarn test:vesper

      - name: Upload Artifacts
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: test-output
          path: |
            packages/vesper/test-results/
            packages/vesper/coverage/
          retention-days: 7
